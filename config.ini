[network]
epochs = 10
batch_size = 64
optimizer = adam
loss = crossentropy
;early_stop = 2.5

[dataset]
basedir = C:\\Users\\play_\\CLionProjects\\automatic_aifes\\dataset
input = 1,28,28
sample_train = 12000
;sample_validation = 0
sample_test = 3000

[layer0]
type = conv2d
activation = relu
filters = 32
channel_axis = 1
kernel_size = 5,5
kernel_stride = 1,1
kernel_dilation = 1,1
kernel_padding = 2,2

[layer1]
type = maxpool2d
channel_axis = 1
kernel_pool_size = 2,2
kernel_stride = 2,2
kernel_padding = 0,0

[layer2]
type = conv2d
activation = relu
filters = 64
channel_axis = 1
kernel_size = 5,5
kernel_stride = 1,1
kernel_dilation = 1,1
kernel_padding = 2,2

[layer3]
type = maxpool2d
channel_axis = 1
kernel_pool_size = 2,2
kernel_stride = 2,2
kernel_padding = 0,0

[layer4]
type = flatten

[layer5]
type = dense
activation = relu
neurons = 128

[layer6]
type = dense
activation = softmax
neurons = 3

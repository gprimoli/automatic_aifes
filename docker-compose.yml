services:
  node:
    build: .
    ports:
      - "4000"
    environment:
      - NODE_ENV=production
    deploy:
      mode: replicated
      replicas: 5
    networks:
      - gossip_net

networks:
  gossip_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          ip_range: 172.19.0.0/24
          gateway: 172.19.0.1
    